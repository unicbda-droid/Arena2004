name: build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev libglew-dev \
            libpng-dev libgl1-mesa-dev xvfb zip
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Selftest (software GL via Xvfb)
        run: xvfb-run -a -s "-screen 0 1600x900x24" ./arena2004 --selftest
      - name: Package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arena2004-linux-x86_64
          path: dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake sdl2 glew libpng pkg-config zip
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arena2004-macos
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-libpng
            zip
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Collect runtime DLLs
        run: |
          cp /mingw64/bin/SDL2.dll build/ 2>/dev/null || true
          cp /mingw64/bin/glew32.dll build/ 2>/dev/null || true
          cp /mingw64/bin/libpng16-16.dll build/ 2>/dev/null || true
          cp /mingw64/bin/zlib1.dll build/ 2>/dev/null || true
          cp /mingw64/bin/libgcc_s_seh-1.dll build/ 2>/dev/null || true
          cp /mingw64/bin/libstdc++-6.dll build/ 2>/dev/null || true
          cp /mingw64/bin/libwinpthread-1.dll build/ 2>/dev/null || true
      - name: Package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arena2004-windows-x86_64
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect ZIPs
        run: find artifacts -name '*.zip' -exec cp {} . \;
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
